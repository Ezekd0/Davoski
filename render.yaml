services:
  - type: web
    name: ai-ctdrs-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements-lock.txt && python manage.py collectstatic --noinput
    # Run migrations in the serving instance, including on Free services.
    # A failed migration exits before Gunicorn can bind its port.
    startCommand: sh start.sh
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ai-ctdrs-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://davoski-frontend.onrender.com
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: TRUST_PROXY
        value: "true"
databases:
  - name: ai-ctdrs-db
    databaseName: ai_ctdrs
    user: ai_ctdrs
